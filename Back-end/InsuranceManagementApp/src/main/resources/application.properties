spring.application.name=SpringFirst
spring.datasource.url=jdbc:mysql://localhost:3306/insurance?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Root logging level
logging.level.root=INFO

# Log file location
logging.file.name=logs/app.log

# Log pattern (optional)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n



spring.web.cors.allowed-origins=http://localhost:5173 # Make sure this matches your React app's URL
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600


